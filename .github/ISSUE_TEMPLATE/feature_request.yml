name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提出建议前，请先确认该能力是否属于**内核**职责。本仓库是附加模块仓库，
        内核契约以 CopperCore 源码为准，模块内不得臆造内核接口。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述你遇到的真实场景，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 所属范围
      options:
        - 本模块自身能力
        - 需要内核新增能力（如动态加载、运行期前端注册、命令动态注册）
        - 需要 cgl-libs 收录侧配合
        - 不确定
    validations:
      required: true

  - type: textarea
    id: permission_impact
    attributes:
      label: 权限影响
      description: 该功能是否需要新增权限？若需要，请列出权限项与理由（权限最小化是审核红线）
      placeholder: |
        无新增权限
        ——或——
        需要 network：用于 ...
    validations:
      required: true

  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 该建议不涉及内置、下载或分发游戏本体及其反编译产物
          required: true
